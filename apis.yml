aid: xingsheng-selected
name: Xingsheng Selected
description: >-
  Xingsheng Selected (兴盛优选, Hunan Xingsheng Youxuan E-Commerce Co., Ltd.) is a Changsha,
  Hunan-based Chinese community group-buying platform, grown out of the Furong Xingsheng
  convenience-store chain and built on a "pre-sale plus self-pickup" model: consumers order
  groceries and daily necessities online by 23:00 and collect them the next morning from a
  neighborhood convenience store acting as a pickup point, supplied through the company's own
  central-warehouse, grid-station and store logistics network. It has raised roughly USD 5.4B
  from investors including Tencent, KKR, Primavera Capital, Temasek and Ontario Teachers'
  Pension Plan, and has contracted out of loss-making provinces since 2022. Xingsheng Selected
  operates no developer program: probing found no portal, documentation, OpenAPI, webhook or
  .well-known document on any host it controls, and its supplier system is login-walled.
