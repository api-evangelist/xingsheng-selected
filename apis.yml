  reason: no-developer-program
  detail: >-
    Xingsheng Selected sells groceries to consumers and onboards suppliers, stores and
    service managers through web forms and a hotline — xsyxsc.com carries no developer
    section, its supplier system at gys.xsyxsc.com is a login-walled internal app, and its
    live application backend mall.xsyxsc.com answers every conventional specification path
    (/v3/api-docs, /openapi.json, /swagger.json, /api-docs, /swagger-resources, /doc.html,
    /actuator) with a Spring Boot JSON 404, so there is no published contract, portal or
    .well-known document anywhere on the estate — the only public code it ships is the
    @xsyx npm scope of internal front-end libraries, last released 2021-03-11, which are
    not clients for any API.
