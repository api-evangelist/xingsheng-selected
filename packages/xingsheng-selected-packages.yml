generated: '2026-09-04'
method: searched
source: https://registry.npmjs.org/-/v1/search?text=%40xsyx (npm registry search, unauthenticated)
note: >-
  Xingsheng Selected publishes no API client SDK, because it publishes no API. What the
  registry search DID find is a first-party npm scope, @xsyx, carrying 121 public packages
  from the company's own front-end platform team: the "hanzo" (汉卓) H5 / WeChat
  mini-program component library used by the consumer group-buying app, a "jarvis" (贾维斯)
  JSON-Schema low-code render engine, a web error-reporting SDK, an H5-to-Flutter bridge,
  auth and routing helpers, and CLI scaffolding. These are INTERNAL platform libraries the
  team published to the public registry — they are not clients for a public Xingsheng API,
  so no `SDKs` pointer is emitted from this file and sdk_count must not be credited from it.
ownership_evidence: >-
  The scope matches the company's own CDN domain (front-prod-cdn.xsyx.xyz, front-xps-cdn.xsyx.xyz,
  both referenced by https://xsyxsc.com/); package repository URLs point at
  https://gitlab.frxs.cn/ (frxs = 芙蓉兴盛 / Furong Xingsheng, the convenience-store group
  Xingsheng Youxuan grew out of); and the package descriptions name the company's exact
  business objects (门店 stores, 预售 pre-sale, 购物车 cart, 兴盛优视 video, 优聘 recruiting).
  All 121 packages carry a single npm maintainer, `chenkuan`.
currency: >-
  ABANDONED IN PUBLIC. The newest package in the scope was published 2021-03-11; 120 of 121
  were last published in 2019 or 2020. The scope has received no release in over five years
  even though the consumer app and supplier system are still running, so nothing here should
  be treated as a supported, current distribution.
